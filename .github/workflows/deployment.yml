name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.x'

    - name: Restore dependencies
      run: dotnet restore JadeEncryption

    - name: Build
      run: dotnet build --configuration Release --no-restore JadeEncryption

    - name: Run tests
      run: dotnet test --no-restore --verbosity normal JadeEncryption

    - name: Publish to GitHub Packages
      run: dotnet pack --configuration Release -o ./nupkg JadeEncryption

    - name: Publish to GitHub Packages
      run: dotnet nuget push ./nupkg/*.nupkg -s https://nuget.pkg.github.com/KaustavCodes/index.json -k ${{ secrets.MY_GITHUB_TOKEN }}
      env:
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    - name: NuGet login (OIDC)
      id: nuget_login
      continue-on-error: true
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USER || 'KaustavCodes' }}

    - name: Publish to NuGet.org (Trusted Publishing)
      if: steps.nuget_login.outcome == 'success'
      run: dotnet nuget push ./nupkg/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate
